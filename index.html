<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Rent Roll · felix</title>
<meta name="viewport" content="width=1320" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     felix tokens — sampled from the screenshot
     ============================================================ */
  :root {
    --accent:        #E8804F;
    --accent-hover:  #DD6E37;
    --accent-press:  #C75A26;
    --accent-soft:   #FBE9DD;
    --accent-tint:   #FFF6F0;

    --ink:    #1A1916;
    --ink-2:  #5B5852;
    --ink-3:  #8E8B82;
    --ink-4:  #BCB8AF;

    --line:        #ECEAE4;
    --line-strong: #DCD8CE;
    --line-soft:   #F2F0EA;

    --surface:    #FFFFFF;
    --surface-2:  #F7F5F0;
    --surface-3:  #EFEDE6;
    --page:       #FFFFFF;

    --warn-bg:     #FFF4D6;
    --warn-bg-h:   #FFEDBA;
    --warn-line:   #ECCB76;
    --warn-strong: #875D0A;
    --warn-deep:   #6B4805;

    --shadow-pop: 0 1px 2px rgba(20,18,10,.04),
                  0 8px 24px rgba(20,18,10,.08),
                  0 24px 60px rgba(20,18,10,.12);

    --radius:    6px;
    --radius-lg: 8px;
    --row-a:     48px;
    --row-b:     88px;

    --sidebar-w: 224px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page);
    color: var(--ink);
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    font-feature-settings: "cv11", "ss01";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  button { font-family: inherit; }

  /* ============================================================
     App shell
     ============================================================ */
  .app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    border-right: 1px solid var(--line);
    background: var(--surface);
    position: sticky; top: 0;
    height: 100vh;
    display: flex; flex-direction: column;
    padding: 14px 12px;
    gap: 2px;
  }
  .sidebar-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px 18px;
  }
  .brand {
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .collapse-btn {
    border: 0; background: transparent; cursor: pointer;
    color: var(--ink-4);
    width: 24px; height: 24px;
    display: grid; place-items: center; border-radius: 4px;
  }
  .collapse-btn:hover { color: var(--ink-2); background: var(--surface-2); }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 10px;
    border-radius: 6px;
    color: var(--ink-3);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: 0; background: transparent;
    width: 100%;
    text-align: left;
    line-height: 1;
    position: relative;
  }
  .nav-item:hover { color: var(--ink); background: var(--surface-2); }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-item.active {
    color: var(--ink);
    font-weight: 600;
  }
  .nav-item.active::after {
    content: "";
    position: absolute;
    right: -12px; top: 5px; bottom: 5px;
    width: 3px; border-radius: 2px 0 0 2px;
    background: var(--accent);
  }
  .nav-group {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 10px 6px;
    color: var(--ink-3);
    font-size: 13px;
    font-weight: 500;
  }
  .nav-group svg { width: 18px; height: 18px; }
  .nav-group .chev { margin-left: auto; color: var(--ink-4); }
  .nav-sub {
    display: flex; align-items: center; gap: 12px;
    padding: 7px 10px 7px 28px;
    color: var(--ink-3);
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
  }
  .nav-sub::before {
    content: "—";
    color: var(--ink-4);
    margin-right: -4px;
    font-weight: 400;
  }
  .nav-sub:hover { color: var(--ink); }
  .nav-sub.active {
    color: var(--ink);
    font-weight: 600;
    position: relative;
  }
  .nav-sub.active::after {
    content: "";
    position: absolute;
    right: -12px; top: 5px; bottom: 5px;
    width: 3px; border-radius: 2px 0 0 2px;
    background: var(--accent);
  }

  /* ============================================================
     Main column
     ============================================================ */
  .main { min-width: 0; padding: 22px 28px 32px; }

  .page-head {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 22px;
  }
  .page-head h1 {
    margin: 0;
    font-size: 26px; font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 6px; border: 0; background: transparent;
    cursor: pointer; color: var(--ink-3);
    display: grid; place-items: center;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink-2); }
  .icon-btn svg { width: 18px; height: 18px; }

  .page-head .spacer { flex: 1; }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border: 0;
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    line-height: 1;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { background: var(--accent-press); }
  .btn-ghost {
    background: transparent; border: 0;
    color: var(--accent);
    padding: 9px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px; font-weight: 500;
  }
  .btn-ghost:hover { background: var(--accent-tint); }

  /* ---------- Filter row ---------- */
  .filters {
    display: flex; align-items: flex-end; gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field-right { margin-left: auto; }
  .field.has-picker { position: relative; }

  /* Custom date range picker */
  .range-picker {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    z-index: 30;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    box-shadow: var(--shadow-pop);
    padding: 14px 16px;
    width: 240px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .range-picker.hidden { display: none; }
  .rp-row { display: flex; flex-direction: column; gap: 5px; }
  .rp-row label {
    font-size: 12px;
    color: var(--ink-3);
    font-weight: 500;
  }
  .rp-row input[type="month"] {
    border: 1px solid var(--line-strong);
    background: var(--surface);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13.5px;
    font-family: inherit;
    color: var(--ink);
    width: 100%;
  }
  .rp-row input[type="month"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .field-label {
    font-size: 12.5px;
    color: var(--ink-2);
    font-weight: 400;
  }

  /* Segmented (split-button) — single rounded outer, buttons share dividers */
  .segmented {
    display: inline-flex;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 6px;
    overflow: hidden;
    line-height: 0;
  }
  .segmented button {
    border: 0;
    border-right: 1px solid var(--line);
    background: var(--surface);
    padding: 8px 14px;
    font-size: 13.5px;
    color: var(--ink-2);
    border-radius: 0;
    cursor: pointer;
    font-weight: 500;
    line-height: 1;
    white-space: nowrap;
    min-width: 84px;
  }
  .segmented button:last-child { border-right: 0; }
  .segmented button:hover { color: var(--ink); background: var(--surface-2); }
  .segmented button.active {
    background: var(--surface-3);
    color: var(--ink);
  }
  .segmented button.active + button { border-left: 0; }
  .segmented button.icon-only {
    min-width: 0;
    padding: 8px 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .segmented button.icon-only svg { display: block; }

  /* Switch */
  .switch {
    display: inline-flex; align-items: center; gap: 10px;
    cursor: pointer; user-select: none;
    padding: 7px 0;
  }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch .track {
    position: relative;
    width: 34px; height: 20px; border-radius: 100px;
    background: #D4D0C5;
    transition: background .15s ease;
  }
  .switch .track::after {
    content: "";
    position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff;
    transition: transform .18s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,.18);
  }
  .switch input:checked + .track {
    background: var(--accent);
  }
  .switch input:checked + .track::after {
    transform: translateX(14px);
  }
  .switch .lbl {
    font-size: 14px; color: var(--ink); font-weight: 500;
  }

  /* ---------- Shared meta + table card ---------- */
  .content-meta {
    display: flex; align-items: center;
    gap: 14px;
    height: 32px;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--ink-2);
  }
  .content-meta .summary { font-variant-numeric: tabular-nums; }
  .content-meta .legend {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--warn-strong);
    background: var(--warn-bg);
    border: 1px solid var(--warn-line);
    padding: 3px 10px 3px 8px;
    border-radius: 100px;
    font-size: 12.5px;
    font-weight: 500;
  }
  .content-meta .legend svg { width: 12px; height: 12px; }
  .content-meta .right {
    margin-left: auto;
    display: inline-flex; gap: 18px; align-items: center;
    color: var(--ink-3); font-size: 13px;
  }
  .content-meta .right b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  .table-card,
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .table-card.hidden,
  .chart-card.hidden { display: none; }

  /* ---------- Table card ---------- */
  .table-scroll {
    overflow: auto;
    max-height: calc(100vh - 240px);
  }
  table.roll {
    border-collapse: separate;
    border-spacing: 0;
    width: max-content;
    min-width: 100%;
    font-variant-numeric: tabular-nums;
  }
  table.roll th, table.roll td {
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    padding: 0;
    text-align: right;
    vertical-align: middle;
    font-size: 13.5px;
    color: var(--ink);
  }
  table.roll thead th {
    position: sticky; top: 0; z-index: 4;
    background: var(--surface);
    height: 40px;
    padding: 0 14px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--ink-3);
    text-align: right;
    white-space: nowrap;
    border-bottom: 1px solid var(--line);
  }
  table.roll thead th.col-entity { text-align: left; left: 0; z-index: 6; }
  table.roll thead th.col-total {
    color: var(--ink);
    font-weight: 600;
    right: 0; z-index: 5; position: sticky;
    background: var(--surface);
    border-left: 1px solid var(--line);
  }

  table.roll td.col-entity {
    position: sticky; left: 0; z-index: 2;
    background: var(--surface);
    text-align: left;
    padding: 0 18px;
    font-weight: 500;
    color: var(--accent);
    border-right: 1px solid var(--line);
    min-width: 240px; max-width: 240px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer;
  }
  table.roll td.col-entity:hover { color: var(--accent-hover); }
  table.roll th.col-entity {
    padding: 0 18px;
    min-width: 240px; max-width: 240px;
    border-right: 1px solid var(--line);
  }

  table.roll td.col-total {
    position: sticky; right: 0; z-index: 1;
    background: var(--surface);
    border-left: 1px solid var(--line);
    font-weight: 600;
    color: var(--ink);
  }
  table.roll td.cell {
    padding: 0 14px;
    height: var(--row-a);
    white-space: nowrap;
    color: var(--ink);
    cursor: pointer;
  }
  body.mode-b table.roll td.cell { height: var(--row-b); padding: 10px 14px; }
  body.mode-b table.roll td.col-entity { height: var(--row-b); }
  body.mode-b table.roll td.col-total { height: var(--row-b); }

  table.roll tbody tr:hover td { background: #FAF8F3; }
  table.roll tbody tr:hover td.col-entity { background: #F4F1EA; color: var(--accent-hover); }

  table.roll tfoot td {
    background: var(--surface-2);
    font-weight: 600;
    height: 44px;
    padding: 0 14px;
    color: var(--ink);
    position: sticky; bottom: 0; z-index: 3;
    border-top: 1px solid var(--line);
    border-bottom: none;
  }
  table.roll tfoot td.col-entity {
    text-align: left;
    z-index: 4;
    color: var(--ink);
    border-right: 1px solid var(--line);
  }
  table.roll tfoot td.col-total {
    background: var(--surface-3);
    z-index: 5;
    border-left: 1px solid var(--line);
  }

  /* Mode A cell — single number */
  .cell-a { font-variant-numeric: tabular-nums; }

  /* Mode B cell — stacked total / invoiced / vacant */
  .cell-b {
    display: flex; flex-direction: column;
    align-items: flex-end;
    gap: 2px;
    line-height: 1.2;
  }
  .cell-b .total {
    font-size: 14px; font-weight: 600; color: var(--ink);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .cell-b .row {
    font-size: 12px; color: var(--ink-3);
    display: flex; gap: 8px;
    align-items: baseline;
    width: 100%;
    justify-content: space-between;
  }
  .cell-b .row .k { font-weight: 400; color: var(--ink-3); }
  .cell-b .row .v { color: var(--ink-2); font-variant-numeric: tabular-nums; font-weight: 500; }
  .cell-b .delta {
    font-size: 11.5px; font-weight: 500;
    color: var(--warn-strong);
    margin-top: 3px;
  }

  td.flagged {
    background: var(--warn-bg) !important;
    cursor: pointer;
  }
  td.flagged:hover { background: var(--warn-bg-h) !important; }
  td.flagged .total svg { color: var(--warn-strong); }

  .warn-ico { color: var(--warn-strong); }



  /* ============================================================
     Popover
     ============================================================ */
  .pop-backdrop { position: fixed; inset: 0; z-index: 50; background: transparent; }
  .popover {
    position: absolute; z-index: 51;
    width: 348px;
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-pop);
    overflow: hidden;
    animation: pop .14s ease-out;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(-4px) scale(.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .pop-head {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #FFFBEB 0%, #FFF7DD 100%);
  }
  .pop-head .ctx {
    font-size: 11.5px; color: var(--warn-deep);
    letter-spacing: 0;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .pop-head .title {
    font-size: 14px; font-weight: 600; color: var(--ink);
    display: flex; align-items: center; gap: 8px;
  }
  .pop-head .title svg { color: var(--warn-strong); flex-shrink: 0; }
  .pop-head .delta {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--warn-strong);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }
  .pop-body {
    padding: 14px 16px;
    font-size: 13px;
    color: var(--ink-2);
    line-height: 1.5;
  }
  .pop-body p { margin: 0 0 6px; }
  .pop-body p strong { color: var(--ink); font-weight: 600; }
  .pop-bookings {
    list-style: none; padding: 0; margin: 0;
  }
  .pop-bookings li {
    display: flex; align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    gap: 10px;
    cursor: pointer;
  }
  .pop-bookings li:hover .b-unit { color: var(--accent); }
  .pop-bookings li:last-child { border-bottom: 0; }
  .pop-bookings .b-icon {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: var(--surface-2);
    color: var(--ink-3);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .pop-bookings .b-text { flex: 1; min-width: 0; }
  .pop-bookings .b-unit {
    font-size: 13px; color: var(--ink); font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pop-bookings .b-tenant {
    font-size: 12px; color: var(--ink-3); margin-top: 1px;
  }
  .pop-bookings .b-amt {
    font-size: 12.5px; color: var(--ink-2);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .pop-bookings .b-arrow {
    color: var(--ink-4);
    flex-shrink: 0;
    transition: transform .15s, color .15s;
  }
  .pop-bookings li:hover .b-arrow {
    color: var(--accent); transform: translateX(2px);
  }

  .pop-cta {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  .pop-cta button {
    width: 100%;
    border: 0;
    background: var(--accent);
    color: #fff;
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex; justify-content: center; align-items: center; gap: 6px;
  }
  .pop-cta button:hover { background: var(--accent-hover); }
  .pop-cta button:active { background: var(--accent-press); }

  /* Popover footer with drill-down link */
  .pop-foot {
    border-top: 1px solid var(--line);
    padding: 8px 10px;
    background: var(--surface-2);
    display: flex;
  }
  .pop-detail-btn {
    background: transparent;
    border: 0;
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    line-height: 1;
  }
  .pop-detail-btn:hover {
    background: var(--accent-tint);
    color: var(--accent-hover);
  }

  /* ============================================================
     Drill-down view
     ============================================================ */
  .detail-back {
    background: transparent; border: 0; cursor: pointer;
    color: var(--ink-2);
    font-size: 13.5px; font-weight: 500;
    padding: 6px 8px 6px 0;
    margin-bottom: 18px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .detail-back:hover { color: var(--accent); }
  .detail-header { margin-bottom: 22px; }
  .detail-header .ctx {
    color: var(--accent);
    font-size: 13px; font-weight: 500;
    margin-bottom: 6px;
  }
  .detail-header h1 {
    margin: 0 0 6px;
    font-size: 26px; font-weight: 600;
    letter-spacing: -0.02em;
  }
  .detail-header .sub {
    color: var(--ink-3); font-size: 13.5px;
  }
  .detail-summary {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 18px;
  }
  .summary-tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 16px 18px;
  }
  .summary-tile .label {
    font-size: 12.5px;
    color: var(--ink-3);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .summary-tile .value {
    font-size: 22px;
    color: var(--ink);
    font-weight: 600;
    letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .summary-tile.flag {
    background: var(--warn-bg);
    border-color: var(--warn-line);
  }
  .summary-tile.flag .label { color: var(--warn-strong); }
  .summary-tile.flag .value { color: var(--warn-strong); }
  /* Regulation info row inside Invoiced tile */
  .reg-tile-info {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .reg-tile-info svg { flex-shrink: 0; }

  /* Change attribution card */
  .attr-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin-bottom: 18px;
  }
  .attr-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--line);
  }
  .attr-ctx { font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
  .attr-total {
    font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;

</div>

<script>
/* ============================================================
   DATA
   ============================================================ */
const MONTHS_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CURRENT_YEAR = 2026;
const CURRENT_MONTH = 4; // May (0-indexed)

const fmtKr = (n) => new Intl.NumberFormat('da-DK').format(Math.round(n)) + ' kr';
const fmtMonthShort = (y, m) => `${MONTHS_EN[m]} '${String(y).slice(-2)}`;

// Lightweight seeded LCG — stable, reproducible fake data
function mkRng(seed) {
  let s = seed >>> 0;
  return () => { s = (Math.imul(1664525, s) + 1013904223) >>> 0; return s / 4294967296; };
}

const STREET_POOLS = {
  nord:          ['Nørrebrogade', 'Jægersborggade', 'Sankt Hans Gade', 'Stefansgade', 'Ravnsborggade', 'Korsgade', 'Blågårdsgade', 'Fælledvej', 'Guldbergsgade', 'Kapelvej'],
  sydhavn:       ['Sydhavnsgade', 'P. Knudsens Gade', 'Borgmester Christiansens Gade', 'Sluseholmen', 'Cylindervej', 'Teglværksgade', 'Scandiagade', 'Vasbygade'],
  osterbro:      ['Trianglen', 'Strandboulevarden', 'Østerbrogade', 'Classensgade', 'Nordre Frihavnsgade', 'Rosenvængets Allé', 'Hornemansgade', 'Vejrøgade'],
  frederiksberg: ['Gammel Kongevej', 'Falkoner Allé', 'Smallegade', 'Frederiksberg Allé', 'Vodroffsvej', 'Howitzvej', 'Godthåbsvej', 'Lindevej'],
  amager:        ['Amagerbrogade', 'Holmbladsgade', 'Englandsvej', 'Uplandsgade', 'Lergravsvej', 'Sundbyvester Plads', 'Vermlandsgade', 'Peder Lykkes Vej'],
};

const FLOORS = [
  'st', '1.tv', '1.th', '1.mf', '2.tv', '2.th', '2.mf',
  '3.tv', '3.th', '3.mf', '4.tv', '4.th', '4.mf', '5.tv', '5.th', '5.mf',
];
const FIRST_INITIALS = ['A.','B.','C.','D.','E.','F.','G.','H.','I.','J.','K.','L.','M.','N.','O.','P.','R.','S.','T.','V.'];
const LAST_NAMES = [
  'Andersen','Christensen','Jensen','Nielsen','Pedersen','Hansen','Sørensen',
  'Larsen','Mortensen','Holm','Lund','Møller','Madsen','Kristiansen','Olsen',
  'Nørgaard','Sand','Egede','Refsgaard','Krogh','Bisgaard','Brandt','Vinter',
  'Klint','Skov','Lassen','Strand','Vinkel','Riis','Bach','Frank','Bro','Damgaard',
];

function buildEntityBookings(entityId, prefix, count, rngSeed) {
  const rng     = mkRng(rngSeed);
  const streets = STREET_POOLS[entityId];
  const main = Array.from({ length: count }, (_, i) => {
    const street  = streets[Math.floor(rng() * streets.length)];
    const houseNo = Math.floor(rng() * 80) + 1;
    const floor   = FLOORS[Math.floor(rng() * FLOORS.length)];
    const first   = FIRST_INITIALS[Math.floor(rng() * FIRST_INITIALS.length)];
    const last    = LAST_NAMES[Math.floor(rng() * LAST_NAMES.length)];
    const amount  = Math.round((8000 + rng() * 4000) / 100) * 100;
    return { id: `${prefix}${i + 1}`, unit: `${street} ${houseNo}, ${floor}`, tenant: `${first} ${last}`, amount, product: '1001 - Monthly Rent' };
  });
  // ~35% of tenants also rent a parking space at 600–1 500 kr/month
  let pi = 0;
  const parking = main.flatMap(b => {
    if (rng() >= 0.35) return [];
    pi++;
    return [{ id: `${prefix}p${pi}`, unit: `Parking P${pi}`, tenant: b.tenant,
              amount: Math.round((600 + rng() * 900) / 100) * 100,
              product: '2001 - Parking', isParking: true, parentId: b.id }];
  });
  return [...main, ...parking];
}

const ENTITIES = [
  { id: 'nord',          name: 'Ejendomsselskab Nord ApS',   bookings: buildEntityBookings('nord',          'n', 120, 101) },
  { id: 'sydhavn',       name: 'Sydhavn Boliger A/S',         bookings: buildEntityBookings('sydhavn',       's', 140, 202) },
  { id: 'osterbro',      name: 'Østerbro Holding ApS',        bookings: buildEntityBookings('osterbro',      'o', 105, 303) },
  { id: 'frederiksberg', name: 'Frederiksberg Ejendomme A/S', bookings: buildEntityBookings('frederiksberg', 'f', 130, 404) },
  { id: 'amager',        name: 'Amager Portefølje ApS',       bookings: buildEntityBookings('amager',        'a', 115, 505) },
];

/* ----------------------------------------------------------------------
   Hand-picked anomalies (stable across reloads).

   Data model: Total = Invoiced + Vacant by construction. There is no
   "missing amount" to detect — the only diagnostic the system can run
   is whether every booking with a tenant was actually invoiced for rent.
   A flagged cell = at least one tenanted booking has invoiced:false.

   Inside default 12-month view (Jun '25 → May '26):
     UN-INVOICED tenanted bookings (cell IS flagged):
       nord-2025-9          (Oct '25)  — n1 L. Andersen
       sydhavn-2026-1       (Feb '26)  — s7 M. Frank + s3 T. Olsen
       frederiksberg-2025-7 (Aug '25)  — f3 N. Bisgaard
       amager-2026-0        (Jan '26)  — a3 K. Strand
       nord-2026-3          (Apr '26)  — n6 P. Mortensen
       osterbro-2025-10     (Nov '25)  — o1 B. Nørgaard
       sydhavn-2025-8       (Sep '25)  — s6 L. Holm
       frederiksberg-2026-0 (Jan '26)  — f1 D. Refsgaard

     REAL VACANCY (unit had no tenant, cell NOT flagged):
       frederiksberg-2025-11(Dec '25)  — f5 vacant
       osterbro-2025-6      (Jul '25)  — o4 vacant
       amager-2026-4        (May '26)  — a5 vacant
       sydhavn-2025-10      (Nov '25)  — s7 vacant
   ---------------------------------------------------------------------- */
const OVERRIDES = {
  // ---- Default 12-month view: un-invoiced tenanted bookings ----
  'nord-2025-9':          (bs) => { bs[0].invoiced = false; },
  'sydhavn-2026-1':       (bs) => { bs[6].invoiced = false; bs[2].invoiced = false; },
  'frederiksberg-2025-7': (bs) => { bs[2].invoiced = false; },
  'amager-2026-0':        (bs) => { bs[2].invoiced = false; },
  'nord-2026-3':          (bs) => { bs[5].invoiced = false; },
  'osterbro-2025-10':     (bs) => { bs[0].invoiced = false; },
  'sydhavn-2025-8':       (bs) => { bs[5].invoiced = false; },
  'frederiksberg-2026-0': (bs) => { bs[0].invoiced = false; },

  // ---- Default 12-month view: real vacancies (no flag) ----
  'frederiksberg-2025-11':(bs) => { bs[4].tenant = null; bs[4].invoiced = false; },
  'osterbro-2025-6':      (bs) => { bs[3].tenant = null; bs[3].invoiced = false; },
  'amager-2026-4':        (bs) => { bs[4].tenant = null; bs[4].invoiced = false; },
  'sydhavn-2025-10':      (bs) => { bs[6].tenant = null; bs[6].invoiced = false; },

  // ---- Older 12 months (24-month view) ----
  'sydhavn-2024-7':       (bs) => { bs[4].invoiced = false; },
  'nord-2025-2':          (bs) => { bs[3].invoiced = false; },
  'amager-2024-8':        (bs) => { bs[1].invoiced = false; },
  'frederiksberg-2025-0': (bs) => { bs[5].invoiced = false; },
  'osterbro-2025-1':      (bs) => { bs[2].tenant = null; bs[2].invoiced = false; },
  'nord-2024-11':         (bs) => { bs[2].tenant = null; bs[2].invoiced = false; },
};

/* ============================================================
   COMPUTE
   ============================================================ */
// Rent in Denmark is typically regulated twice a year — in January and
// September — with a small step-up that lifts every booking's monthly
// amount from that month onward. Within our 24-month window (Jun '24 →
// May '26) that gives four regulations.
// UNIFORM regulations: all tenants regulated together in September each year.
const UNIFORM_REGS = [
  { y: 2024, m: 8 }, // Sep '24
  { y: 2025, m: 8 }, // Sep '25
];

// PARTIAL regulations: only bookings where (index % mod < rem) are regulated.
// Represents months where individual tenants have bespoke regulation dates.
const PARTIAL_REGS = [
  { y: 2025, m: 10, mod: 3, rem: 1 }, // Nov '25 — ~33 % of tenants
  { y: 2026, m:  0, mod: 4, rem: 1 }, // Jan '26 — ~25 %
  { y: 2026, m:  2, mod: 5, rem: 1 }, // Mar '26 — ~20 %
  { y: 2026, m:  3, mod: 6, rem: 1 }, // Apr '26 — ~17 %
];

const REG_STEP = 1.022; // ~2.2 % step per regulation event

// Cumulative regulation count for one booking by (y, m).
function bookingRegCount(idx, y, m) {
  let n = 0;
  for (const r of UNIFORM_REGS) {
    if (r.y < y || (r.y === y && r.m <= m)) n++;
  }
  for (const r of PARTIAL_REGS) {
    if ((r.y < y || (r.y === y && r.m <= m)) && idx % r.mod < r.rem) n++;
  }
  return n;
}

// Was this specific booking regulated in exactly month (y, m)?
function isRegulatedInMonth(idx, y, m) {
  for (const r of UNIFORM_REGS) { if (r.y === y && r.m === m) return true; }
  for (const r of PARTIAL_REGS) { if (r.y === y && r.m === m && idx % r.mod < r.rem) return true; }
  return false;
}

// Booking amounts are the Jun-2024 baseline, compounded per regulation event.
function rentFor(baseline, idx, y, m) {
  return Math.round(baseline * Math.pow(REG_STEP, bookingRegCount(idx, y, m)));
}

function getCell(entity, y, m) {
  const bookings = entity.bookings.map((b, idx) => ({
    ...b,
    invoiced: true,
    // Parking spaces have a fixed rate — not subject to rent regulation
    monthly: b.isParking ? b.amount : rentFor(b.amount, idx, y, m),
    regulatedThisMonth: !b.isParking && isRegulatedInMonth(idx, y, m),
  }));
  const k = `${entity.id}-${y}-${m}`;
  if (OVERRIDES[k]) OVERRIDES[k](bookings);

  let invoiced = 0, vacant = 0;
  for (const b of bookings) {
    if (b.tenant === null) vacant += b.monthly;
    else if (b.invoiced) invoiced += b.monthly;
  }
  const total = invoiced + vacant;
  const notInvoiced    = bookings.filter(b => b.tenant !== null && !b.invoiced);
  const flagged        = notInvoiced.length > 0;
  const tenantedCount  = bookings.filter(b => b.tenant !== null).length;
  const regulatedCount = bookings.filter(b => b.tenant !== null && b.regulatedThisMonth).length;
  const totalIncrease  = bookings
    .filter(b => b.tenant !== null && b.invoiced && b.regulatedThisMonth)
    .reduce((s, b) => s + Math.round(b.monthly * (1 - 1 / REG_STEP)), 0);
  // Per-product subtotals for tile breakdowns
  const invoicedByProduct = {}, vacantByProduct = {};
  bookings.filter(b => b.tenant !== null && b.invoiced).forEach(b => {
    const p = b.product || '1001 - Monthly Rent';
    invoicedByProduct[p] = (invoicedByProduct[p] || 0) + b.monthly;
  });
  bookings.filter(b => b.tenant === null).forEach(b => {
    const p = b.product || '1001 - Monthly Rent';
    vacantByProduct[p] = (vacantByProduct[p] || 0) + b.monthly;
  });
  return { total, invoiced, vacant, bookings, flagged, notInvoiced, regulatedCount, tenantedCount, y, m, totalIncrease, invoicedByProduct, vacantByProduct };
}

function getMonths(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(CURRENT_YEAR, CURRENT_MONTH - i, 1);
    out.push({ y: d.getFullYear(), m: d.getMonth() });
  }
  return out;
}

// Months currently shown — driven by preset or custom range.
function currentMonths() {
  if (state.mode === 'custom') {
    const out = [];
    let y = state.customStart.y, m = state.customStart.m;
    const ey = state.customEnd.y, em = state.customEnd.m;
    while (y < ey || (y === ey && m <= em)) {
      out.push({ y, m });
      m++;
      if (m > 11) { m = 0; y++; }
    }
    return out;
  }
  return getMonths(state.range);
}

/* ============================================================
   STATE + RENDER
   ============================================================ */
const state = {
  range: 3,              // preset months count
  mode: 'preset',        // 'preset' | 'custom'
  customStart: { y: 2025, m: 11 }, // Dec 2025
  customEnd:   { y: 2026, m: 4 }, // May 2026
  vacantOn: true
};


const $roll = document.getElementById('roll');
const $rangeGroup = document.getElementById('range');

const $vacantToggle = document.getElementById('vacant-toggle');
const $cardTable = document.getElementById('card-table');

const $rangePicker = document.getElementById('range-picker');
const $rpFrom = document.getElementById('rp-from');
const $rpTo = document.getElementById('rp-to');

function render() {
  document.body.classList.toggle('mode-b', state.vacantOn);
  document.body.classList.toggle('mode-a', !state.vacantOn);

  const months = currentMonths();
  const grid = ENTITIES.map(e => months.map(mm => getCell(e, mm.y, mm.m)));

  renderTable(months, grid);
}

function renderTable(months, grid) {
  // thead
  let thead = '<thead><tr>';
  thead += `<th class="col-entity">Entity</th>`;
  for (const mm of months) thead += `<th>${fmtMonthShort(mm.y, mm.m)}</th>`;
  thead += `<th class="col-total">Total</th>`;
  thead += '</tr></thead>';

  // tbody
  let tbody = '<tbody>';
  ENTITIES.forEach((e, ei) => {
    tbody += `<tr>`;
    tbody += `<td class="col-entity" title="${e.name}">${e.name}</td>`;
    let rowTotalInvoiced = 0, rowTotalTotal = 0;
    months.forEach((mm, mi) => {
      const c = grid[ei][mi];
      rowTotalInvoiced += c.invoiced;
      rowTotalTotal += c.total;
      const cls = `cell${c.flagged ? ' flagged' : ''}`;
      const dataAttrs = `data-entity="${e.id}" data-y="${mm.y}" data-m="${mm.m}"`;
      // Month-over-month delta vs previous month (may fall outside visible range)
      const prevInvoiced = mi > 0
        ? grid[ei][mi - 1].invoiced
        : getCell(e, ...(() => { const d = new Date(mm.y, mm.m - 1, 1); return [d.getFullYear(), d.getMonth()]; })()).invoiced;
      const delta = c.invoiced - prevInvoiced;
      tbody += `<td class="${cls}" ${dataAttrs}>${renderCell(c, delta)}</td>`;
    });
    const rowTotal = state.vacantOn ? rowTotalTotal : rowTotalInvoiced;
    tbody += `<td class="col-total">${fmtKr(rowTotal)}</td>`;
    tbody += `</tr>`;
  });
  tbody += '</tbody>';

  // tfoot
  let tfoot = '<tfoot><tr>';
  tfoot += `<td class="col-entity">Total</td>`;
  let grand = 0;
  months.forEach((mm, mi) => {
    let colSum = 0;
    ENTITIES.forEach((e, ei) => {
      const c = grid[ei][mi];
      colSum += state.vacantOn ? c.total : c.invoiced;
    });
    grand += colSum;
    tfoot += `<td>${fmtKr(colSum)}</td>`;
  });
  tfoot += `<td class="col-total">${fmtKr(grand)}</td>`;
  tfoot += '</tr></tfoot>';

  $roll.innerHTML = thead + tbody + tfoot;
}

/* ============================================================
   CHART RENDER
   ============================================================ */


function regBadge(c) {
  if (!c.regulatedCount) return '';
  const all   = c.regulatedCount === c.tenantedCount;
  const label = all ? 'Regulation' : `Regulation ${c.regulatedCount} / ${c.tenantedCount}`;
  const tip   = all
    ? `Rent regulation — all ${c.tenantedCount} tenants received an increase in ${MONTHS_EN[c.m]} ${c.y}.`
    : `Rent regulation — ${c.regulatedCount} of ${c.tenantedCount} tenants received an increase in ${MONTHS_EN[c.m]} ${c.y}.`;
  return `<span class="reg-badge" data-tip="${tip}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>${label}</span>`;
}

const WARN_ICO = `<svg class="warn-ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>`;

function renderCell(c, delta = 0) {
  // Month-over-month delta indicator
  const UP_SVG   = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>`;
  const DOWN_SVG = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>`;
  const deltaHtml = delta !== 0
    ? `<span class="cell-delta ${delta > 0 ? 'cell-delta-up' : 'cell-delta-down'}">${delta > 0 ? UP_SVG : DOWN_SVG}${delta > 0 ? '+' : '−'}${fmtKr(Math.abs(delta))}</span>`
    : '';

  if (!state.vacantOn) {
    const amtRow = c.flagged
      ? `<span style="display:inline-flex;align-items:center;gap:5px">${WARN_ICO}${fmtKr(c.invoiced)}</span>`
      : `<span>${fmtKr(c.invoiced)}</span>`;
    return deltaHtml
      ? `<div class="cell-a" style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;padding:7px 0">${amtRow}${deltaHtml}</div>`
      : `<div class="cell-a" style="display:flex;align-items:center;justify-content:flex-end">${amtRow}</div>`;
  }
  const warnIco   = c.flagged ? WARN_ICO : '';
  const breakdown = c.vacant > 0 ? `
      <div class="row"><span class="k">Invoiced:</span><span class="v">${fmtKr(c.invoiced)}</span></div>
      <div class="row"><span class="k">Vacant:</span><span class="v">${fmtKr(c.vacant)}</span></div>` : '';
  return `
    <div class="cell-b">
      <div class="total">${warnIco}${fmtKr(c.total)}</div>
      ${breakdown}
      ${deltaHtml}
    </div>`;
}

/* ============================================================
   CONTROLS
   ============================================================ */
$rangeGroup.addEventListener('click', (ev) => {
  const btn = ev.target.closest('button[data-range]');
  if (!btn) return;
  const r = btn.dataset.range;
  if (r === 'custom') {
    // Activate custom mode; toggle the picker so a second click closes it.
    state.mode = 'custom';
    setRangeActive('custom');
    syncPickerInputs();
    $rangePicker.classList.toggle('hidden');
    closePopover();
    render();
    return;
  }
  const num = parseInt(r, 10);
  if (state.mode === 'preset' && num === state.range) return;
  state.mode = 'preset';
  state.range = num;
  setRangeActive(String(num));
  $rangePicker.classList.add('hidden');
  closePopover();
  render();
});

function setRangeActive(v) {
  $rangeGroup.querySelectorAll('button').forEach(b =>
    b.classList.toggle('active', b.dataset.range === v)
  );
}
function syncPickerInputs() {
  const ms = (mm) => `${mm.y}-${String(mm.m + 1).padStart(2, '0')}`;
  $rpFrom.value = ms(state.customStart);
  $rpTo.value   = ms(state.customEnd);
}
function applyCustomFromInputs() {
  if (!$rpFrom.value || !$rpTo.value) return;
  const [fy, fmRaw] = $rpFrom.value.split('-').map(Number);
  const [ty, tmRaw] = $rpTo.value.split('-').map(Number);
  let start = { y: fy, m: fmRaw - 1 };
  let end   = { y: ty, m: tmRaw - 1 };
  // Ensure start <= end
  if (start.y > end.y || (start.y === end.y && start.m > end.m)) {
    [start, end] = [end, start];
  }
  state.mode = 'custom';
  state.customStart = start;
  state.customEnd = end;
  setRangeActive('custom');
  syncPickerInputs();
  closePopover();
  render();
}

$rpTo.addEventListener('change', applyCustomFromInputs);

   ============================================================ */
let popoverEl = null;
let popoverBackdrop = null;
let popoverAnchor = null;

function openPopover(cellEl) {
  closePopover();
  const entityId = cellEl.dataset.entity;
  const y = parseInt(cellEl.dataset.y, 10);
  const m = parseInt(cellEl.dataset.m, 10);
  const entity = ENTITIES.find(e => e.id === entityId);
  const c = getCell(entity, y, m);
  if (!c.flagged) return;

  popoverAnchor = cellEl;
  const backdrop = document.createElement('div');
  backdrop.className = 'pop-backdrop';
  backdrop.addEventListener('click', closePopover);
  document.body.appendChild(backdrop);
  popoverBackdrop = backdrop;

  const pop = document.createElement('div');
  pop.className = 'popover';
  pop.innerHTML = renderPopover(entity, y, m, c);
  document.body.appendChild(pop);
  popoverEl = pop;

  pop.querySelectorAll('[data-booking]').forEach(row => {
    row.addEventListener('click', () => {
      const id = row.dataset.booking;
      alert(`Booking #${id} — would open booking detail in production.`);
    });
  });
  const detailBtn = pop.querySelector('[data-detail-cta]');
  if (detailBtn) {
    detailBtn.addEventListener('click', () => goToDetailed(entityId, y, m));
  }
  positionPopover(cellEl, pop);
}

function positionPopover(anchor, pop) {
  const rect = anchor.getBoundingClientRect();
  const popRect = pop.getBoundingClientRect();
  const gap = 6, margin = 8;
  let top = rect.bottom + gap;
  if (top + popRect.height + margin > window.innerHeight) {
    top = Math.max(margin, rect.top - popRect.height - gap);
  }
  let left = rect.right - popRect.width;
  if (left < margin) left = margin;
  if (left + popRect.width + margin > window.innerWidth) {
    left = window.innerWidth - popRect.width - margin;
  }
  pop.style.top = `${top + window.scrollY}px`;
  pop.style.left = `${left + window.scrollX}px`;
}

function closePopover() {
  if (popoverEl) { popoverEl.remove(); popoverEl = null; }
  if (popoverBackdrop) { popoverBackdrop.remove(); popoverBackdrop = null; }
  popoverAnchor = null;
}

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') closePopover();
});
window.addEventListener('resize', () => {
  if (popoverEl && popoverAnchor) positionPopover(popoverAnchor, popoverEl);
});
document.getElementById('table-scroll').addEventListener('scroll', () => {
  if (popoverEl) closePopover();
});

$roll.addEventListener('click', (ev) => {
  const td = ev.target.closest('td.cell');
  if (!td) return;
  ev.stopPropagation();
  if (td.classList.contains('flagged')) {
    openPopover(td);
  } else {
    goToDetailed(td.dataset.entity, +td.dataset.y, +td.dataset.m);
  }
});

/* ============================================================
   DRILL-DOWN HELPERS
   ============================================================ */
// Derive 4-digit payer ID deterministically from booking ID.
// Format: <entity-digit><zero-padded-3-digit-seq>  e.g. n42 → 2042
function getPayerCode(bookingId) {
  const prefixNum = { n: 1, s: 2, o: 3, f: 4, a: 5 };
  const letter = bookingId.charAt(0);
  const num    = parseInt(bookingId.slice(1), 10);
  if (isNaN(num)) return null; // parking IDs like 'np1' — show '—' in table
  return `${prefixNum[letter] || 9}${String(num).padStart(3, '0')}`;
}


function fmtDate(d) {
  return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
}

function lastDayOfMonth(y, m) {
  return new Date(y, m + 1, 0).getDate();
}

// Returns the canonical issue/due/period dates for a rent charge in month (y, m).
// Due  = 1st of the month (standard); issue = due – 8 days.
// For a first-month charge the caller may override due to an earlier date — that
// logic lives in the booking itself; here we use the standard rule for the prototype.
function chargeDates(y, m) {
  const due         = new Date(y, m, 1);
  const issue       = new Date(+due - 8 * 86400000);
  const periodStart = new Date(y, m, 1);
  const periodEnd   = new Date(y, m, lastDayOfMonth(y, m));
  return { due, issue, periodStart, periodEnd };
}

function buildInvoiceId(y, m, seq) {
  // 9-digit numeric ID: YYYYMM + zero-padded 3-digit sequence, e.g. 202605001
  return `${y}${String(m + 1).padStart(2,'0')}${String(seq).padStart(3,'0')}`;
}

/* ---------- New tenancy approximation ---------- */
// Seeded deterministic approximation: in ~38% of months some units re-let
// at a different rate. No tenant history needed for the prototype.
// Returns {total, byId: {bookingId → delta}} using a stable seed.
// The dir/delta RNG calls are identical to the old newTenancyApprox so totals
// stay consistent; the extra rng() call picks which booking carries the change.
function newTenancyDetails(entityId, y, m, bookings) {
  const s = entityId.split('').reduce((a, c) => a + c.charCodeAt(0) * 31, 0);
  const rng = mkRng((s + y * 100 + m * 13 + 8421) >>> 0);
  if (rng() > 0.38) return { total: 0, byId: {} };
  const count = 1 + Math.floor(rng() * 3);
  const tenanted = bookings.filter(b => b.tenant !== null && b.invoiced && !b.isParking);
  let total = 0;
  const byId = {};
  for (let i = 0; i < count; i++) {
    const dir   = rng() > 0.28 ? 1 : -1;
    const delta = dir * (Math.round((500 + rng() * 2500) / 100) * 100);
    // Pick a booking to carry this change (extra rng call — doesn't affect delta)
    const pick = tenanted[Math.floor(rng() * tenanted.length)];
    if (pick) byId[pick.id] = (byId[pick.id] || 0) + delta;
    total += delta;
  }
  return { total, byId };
}

/* ---------- Change attribution card ---------- */
function renderAttributionCard(entity, y, m, c, prevCell, newTenEffect) {
  const prevMo = m === 0 ? 11 : m - 1;
  const prevYr = m === 0 ? y - 1 : y;
  const deltaTotal = Math.round(c.invoiced - prevCell.invoiced);

  const curMissed  = c.notInvoiced.reduce((s, b) => s + b.monthly, 0);
  const prevMissed = prevCell.notInvoiced.reduce((s, b) => s + b.monthly, 0);

  const regEffect    = c.totalIncrease;
  const vacEffect    = Math.round(prevCell.vacant - c.vacant);
  const missEffect   = Math.round(prevMissed - curMissed);
  const otherEffect  = Math.round(deltaTotal - regEffect - vacEffect - missEffect - newTenEffect);

  const UP_S = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>`;
  const DN_S = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>`;

  const sgn = n => n >= 0 ? `+${fmtKr(n)}` : `−${fmtKr(Math.abs(n))}`;
  const clr = n => n > 0 ? 'up' : n < 0 ? 'dn' : 'n';
  const arr = n => n > 0 ? UP_S : n < 0 ? DN_S : '';

  const allAmts = [regEffect, vacEffect, missEffect, newTenEffect, otherEffect];
  const maxAbs  = Math.max(...allAmts.map(a => Math.abs(a)), 1);
  const barW    = n => `${Math.round(Math.abs(n) / maxAbs * 100)}%`;

  const I_REG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`;
  const I_TEN = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>`;
  const I_VAC = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>`;
  const I_MIS = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><line x1="9" y1="13" x2="15" y2="13"/></svg>`;
  const I_OTH = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>`;

  function row(ico, icoCls, title, sub, amt, barClr, fk) {
    if (amt === 0) return '';
    return `<div class="attr-driver" data-filter="${fk}" onclick="applyChargesFilter('${fk}',this)">
        <div class="attr-icon ${icoCls}">${ico}</div>
        <div class="attr-label">
          <div class="title">${title}</div>
          ${sub ? `<div class="sub">${sub}</div>` : ''}
        </div>
        <div class="attr-bar"><div class="attr-bar-bg"><div class="attr-bar-fill" style="width:${barW(amt)};background:${barClr}"></div></div></div>
        <div class="attr-amt ${clr(amt)}">${arr(amt)}&thinsp;${sgn(amt)}</div>
      </div>`;
  }

  const regSub = c.regulatedCount > 0
    ? (c.regulatedCount === c.tenantedCount
        ? `All ${c.tenantedCount} units — uniform regulation`
        : `${c.regulatedCount} of ${c.tenantedCount} units — partial regulation month`)
    : '';
  const tenSub = newTenEffect > 0 ? 'New tenants at higher rate than previous'
               : newTenEffect < 0 ? 'New tenants at lower rate than previous' : '';
  const vacSub = vacEffect > 0 ? 'Vacant unit(s) re-let this month'
               : vacEffect < 0 ? 'Unit(s) became vacant this month' : '';
  const misSub = missEffect < 0
    ? `${c.notInvoiced.length} booking${c.notInvoiced.length !== 1 ? 's' : ''} not invoiced this month`
    : missEffect > 0 ? 'Fewer missed invoices than last month' : '';

  const GREEN = '#2A7D4F', RED = '#C0392B', GRAY = '#8E8B82';

  const drivers = [
    row(I_REG, regEffect > 0 ? 'g' : 'n', 'Regulation',       regSub,  regEffect,    GREEN,       'regulation'),
    row(I_TEN, newTenEffect > 0 ? 'g':'r','New tenancy',       tenSub,  newTenEffect, newTenEffect > 0 ? GREEN : RED, 'new-tenancy'),
    row(I_VAC, vacEffect >= 0 ? 'g' : 'r','Vacancy',          vacSub,  vacEffect,    vacEffect >= 0 ? GREEN : RED,  'vacancy'),
    row(I_MIS, missEffect >= 0 ? 'g':'r', 'Missed invoices',  misSub,  missEffect,   missEffect >= 0 ? GREEN : RED, 'missed'),
    row(I_OTH, 'n',                       'Other / unexplained','Residual after all known drivers', otherEffect, GRAY,        'other'),
  ].join('');

  const totCls = deltaTotal >= 0 ? 'up' : 'dn';
  return `<div class="attr-card">
      <div class="attr-head">
        <span class="attr-ctx">Change vs. ${MONTHS_EN[prevMo]} ${prevYr}</span>
      </div>
      ${drivers}
      <div class="attr-foot">
        <span>Regulation &middot; new tenancy &middot; vacancy &middot; invoicing &middot; other</span>
        <span class="sum">= ${sgn(deltaTotal)} &check;</span>
      </div>
    </div>`;
}

/* ---------- Charges table ---------- */
function renderDetailCharges(entity, y, m, c, prevCell, newTenByIds = {}) {
  const { due, issue, periodStart, periodEnd } = chargeDates(y, m);
  const period   = `${fmtDate(periodStart)} – ${fmtDate(periodEnd)}`;
  const issueStr = fmtDate(issue);
  const dueStr   = fmtDate(due);

  // Build previous-month lookup {id → {monthly, tenant}}
  const prevMap = {};
  if (prevCell) prevCell.bookings.forEach(pb => { prevMap[pb.id] = pb; });

  const UP_I = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>`;
  const DN_I = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>`;

  function getDriverKey(b) {
    const prev = prevMap[b.id];
    if (b.tenant === null && prev && prev.tenant !== null) return 'vacancy';
    if (b.tenant !== null && prev && prev.tenant === null) return 'vacancy';
    if (newTenByIds[b.id]) return 'new-tenancy';
    if (b.regulatedThisMonth) return 'regulation';
    const delta = prev ? Math.round(b.monthly - prev.monthly) : 0;
    if (delta !== 0) return 'other';
    return 'unchanged';
  }

  function changeIndicator(b) {
    const prev = prevMap[b.id];
    // Vacancy transitions — show monetary impact so admin can reconcile attribution card
    if (b.tenant === null && prev && prev.tenant !== null)
      return `<div class="row-reg-inc" style="color:#C0392B">${DN_I} −${fmtKr(prev.monthly)} · Became vacant</div>`;
    if (b.tenant !== null && prev && prev.tenant === null)
      return `<div class="row-reg-inc" style="color:#2A7D4F">${UP_I} +${fmtKr(b.monthly)} · Now occupied</div>`;
    // New tenancy: synthetic rate change assigned to this booking
    const ntDelta = newTenByIds[b.id];
    if (ntDelta) {
      const color = ntDelta > 0 ? '#2A7D4F' : '#C0392B';
      const arrow = ntDelta > 0 ? UP_I : DN_I;
      const sign  = ntDelta > 0 ? '+' : '−';
      return `<div class="row-reg-inc" style="color:${color}">${arrow} ${sign}${fmtKr(Math.abs(ntDelta))} · New tenancy</div>`;
    }
    // Regulation or other amount delta
    const delta = prev ? Math.round(b.monthly - prev.monthly) : 0;
    if (delta === 0) return '';
    const color = delta > 0 ? '#2A7D4F' : '#C0392B';
    const arrow = delta > 0 ? UP_I : DN_I;
    const sign  = delta > 0 ? '+' : '−';
    const label = b.regulatedThisMonth ? 'Regulation' : 'Rate change';
    return `<div class="row-reg-inc" style="color:${color}">${arrow} ${sign}${fmtKr(Math.abs(delta))} · ${label}</div>`;
  }

  const invoicedBookings = c.bookings.filter(b => b.tenant !== null && b.invoiced);
  const aptBookings  = invoicedBookings.filter(b => !b.isParking);
  const parkBookings = invoicedBookings.filter(b => b.isParking);
  const vacantBookings   = c.bookings.filter(b => b.tenant === null);

  if (!invoicedBookings.length && !vacantBookings.length) {
    return `
      <div class="charges-card">
        <div style="padding:48px;text-align:center;color:var(--ink-3);font-size:13.5px">
          No charges for this period.
        </div>
      </div>`;
  }

  const invoicedRows = [...aptBookings.map((b, i) => {const _seq=i+1; return {b,_seq};}), ...parkBookings.map((b,i)=>{const _seq=500+i+1; return {b,_seq};})].map(({b,_seq}, _unused) => {
    const invId     = buildInvoiceId(y, m, _seq);
    const safeInvId = invId.replace(/'/g, "\\'");
    const _dk = getDriverKey(b);
    return `
      <tr data-driver="${_dk}">
        <td class="muted">${issueStr}</td>
        <td class="muted">${dueStr}</td>
        <td class="muted">${period}</td>
        <td>${b.unit}</td>
        <td>${b.tenant}</td>
        <td class="muted">${getPayerCode(b.parentId || b.id) || '—'}</td>
        <td class="muted">${b.product || '1001 - Monthly Rent'}</td>
        <td class="invoice-id">
          <a href="#" onclick="alert('Invoice ${safeInvId}\\nWould open invoice detail in production.');return false;">${invId}</a>
        </td>
        <td class="num">${fmtKr(b.monthly)}${changeIndicator(b)}</td>
      </tr>`;
  }).join('');

  const vacantRows = vacantBookings.map(b => `
      <tr class="charges-vacant" data-driver="${getDriverKey(b)}">
        <td class="muted">—</td>
        <td class="muted">—</td>
        <td class="muted">${period}</td>
        <td>${b.unit}</td>
        <td class="muted" style="font-style:italic">Vacant</td>
        <td class="muted">—</td>
        <td class="muted">—</td>
        <td class="muted">—</td>
        <td class="num">${fmtKr(b.monthly)}${changeIndicator(b)}</td>
      </tr>`).join('');

  return `
    <div class="charges-card">
      <div class="charges-scroll">
        <table class="charges">
          <thead>
            <tr>
              <th class="sortable" onclick="sortChargesTable(this)">Issue date <span class="sort-ico" aria-hidden="true">⇅</span></th>
              <th class="sortable" onclick="sortChargesTable(this)">Due date <span class="sort-ico" aria-hidden="true">⇅</span></th>
              <th class="sortable" onclick="sortChargesTable(this)">Accounting period <span class="sort-ico" aria-hidden="true">⇅</span></th>
              <th class="sortable" onclick="sortChargesTable(this)">Unit <span class="sort-ico" aria-hidden="true">⇅</span></th>
              <th class="sortable" onclick="sortChargesTable(this)">Payer name <span class="sort-ico" aria-hidden="true">⇅</span></th>
              <th class="sortable" onclick="sortChargesTable(this)">Payer accounting no. <span class="sort-ico" aria-hidden="true">⇅</span></th>
              <th class="sortable" onclick="sortChargesTable(this)">Invoicing product <span class="sort-ico" aria-hidden="true">⇅</span></th>
              <th class="sortable" onclick="sortChargesTable(this)">Invoice ID <span class="sort-ico" aria-hidden="true">⇅</span></th>
              <th class="num sortable" onclick="sortChargesTable(this)">Amount <span class="sort-ico" aria-hidden="true">⇅</span></th>
            </tr>
          </thead>
          <tbody>
            ${vacantBookings.length > 0 && invoicedBookings.length > 0 ? `
            <tr class="charges-section-hd"><td colspan="9">Vacant units — ${vacantBookings.length}</td></tr>` : ''}
            ${vacantRows}
            ${vacantBookings.length > 0 && invoicedBookings.length > 0 ? `
            <tr class="charges-section-hd"><td colspan="9">Invoiced charges — ${invoicedBookings.length}</td></tr>` : ''}
            ${invoicedRows}
          </tbody>
        </table>
      </div>
    </div>`;
}

const $detailCtx = document.getElementById('detail-ctx');
const $detailTitle = document.getElementById('detail-title');

const $detailTotal = document.getElementById('detail-total');
const $detailInvoiced = document.getElementById('detail-invoiced');
const $detailVacant = document.getElementById('detail-vacant');
const $backBtn = document.getElementById('back-btn');

function goToDetailed(entityId, y, m) {
  closePopover();
  const entity = ENTITIES.find(e => e.id === entityId);
  if (!entity) return;
  const c = getCell(entity, y, m);
  const monthLong = `${MONTHS_EN[m]} ${y}`;

  // Header
  $detailCtx.textContent = entity.name;
  $detailTitle.textContent = `${monthLong} rent`;
  // Summary tiles
  $detailTotal.textContent    = fmtKr(c.total);
  $detailInvoiced.textContent = fmtKr(c.invoiced);
  $detailVacant.textContent   = fmtKr(c.vacant);

  // Regulation info inside detail-reg-info').innerHTML = '';

  // Previous month cell (for change attribution) — must come before anything using prevCell
  const _pd = new Date(y, m - 1, 1);
  const prevCell = getCell(entity, _pd.getFullYear(), _pd.getMonth());

  // Per-product breakdown in Invoiced tile
  const prevByProduct = {};
  prevCell.bookings.filter(pb => pb.tenant !== null && pb.invoiced).forEach(pb => {
    const p = pb.product || '1001 - Monthly Rent';
    prevByProduct[p] = (prevByProduct[p] || 0) + pb.monthly;
  });
  const _upT = `<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>`;
  const _dnT = `<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>`;
  const skuHtml = Object.entries(c.invoicedByProduct).map(([prod, amt]) => {
    const delta = Math.round(amt - (prevByProduct[prod] || 0));
    const name  = prod;
    let deltaHtml = '';
    if (delta !== 0) {
      const cls = delta > 0 ? 'up' : 'dn';
      const ico = delta > 0 ? _upT : _dnT;
      const sgn = delta > 0 ? '+' : '−';
      deltaHtml = ` <span class="inv-sku-delta ${cls}">${ico} ${sgn}${fmtKr(Math.abs(delta))}</span>`;
    }
    return `<div class="inv-sku"><span class="inv-sku-name">${name}</span><span class="inv-sku-amt">${fmtKr(amt)}${deltaHtml}</span></div>`;
  }).join('');
  document.getElementById('detail-invoiced-breakdown').innerHTML =
    `<div class="inv-breakdown">${skuHtml}</div>`;

  // Vacant tile SKU breakdown
  const prevVacByProduct = {};
  prevCell.bookings.filter(pb => pb.tenant === null).forEach(pb => {
    const p = pb.product || '1001 - Monthly Rent';
    prevVacByProduct[p] = (prevVacByProduct[p] || 0) + pb.monthly;
  });
  const vacSkuHtml = Object.entries(c.vacantByProduct).map(([prod, amt]) => {
    const delta = Math.round(amt - (prevVacByProduct[prod] || 0));
    const name  = prod;
    let deltaHtml = '';
    if (delta !== 0) {
      const cls = delta > 0 ? 'up' : 'dn';
      const ico = delta > 0 ? _upT : _dnT;
      const sgn = delta > 0 ? '+' : '−';
      deltaHtml = ` <span class="inv-sku-delta ${cls}">${ico} ${sgn}${fmtKr(Math.abs(delta))}</span>`;
    }
    return `<div class="inv-sku"><span class="inv-sku-name">${name}</span><span class="inv-sku-amt">${fmtKr(amt)}${deltaHtml}</span></div>`;
  }).join('');
  document.getElementById('detail-vacant-breakdown').innerHTML =
    vacSkuHtml ? `<div class="inv-breakdown">${vacSkuHtml}</div>` : '';

  // Delta indicator inside Total tile
  const totalDelta = Math.round(c.total - prevCell.total);
  const _up  = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>`;
  const _dn  = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>`;
  const $td = document.getElementById('detail-total-delta');
  if (totalDelta !== 0) {
    const col = totalDelta > 0 ? '#2A7D4F' : '#C0392B';
    const ico = totalDelta > 0 ? _up : _dn;
    const lbl = totalDelta > 0 ? `+${fmtKr(totalDelta)}` : `−${fmtKr(Math.abs(totalDelta))}`;
    $td.innerHTML = `<div class="reg-tile-info" style="color:${col}">${ico} ${lbl} vs. ${MONTHS_EN[_pd.getMonth()]} ${_pd.getFullYear()}</div>`;
  } else {
    $td.innerHTML = '';
  }

  // New tenancy details — computed once, shared between attribution card and charges table
  const ntDetails = newTenancyDetails(entity.id, y, m, c.bookings);

  // Change attribution card
  document.getElementById('detail-attribution-host').innerHTML =
    renderAttributionCard(entity, y, m, c, prevCell, ntDetails.total);

  // Alert box (only rendered when there are missing invoices)
  document.getElementById('detail-alert-host').innerHTML =
    renderDetailAlert(entity, y, m, c.notInvoiced);

  // Charges table
  document.getElementById('detail-charges-host').innerHTML =
    renderDetailCharges(entity, y, m, c, prevCell, ntDetails.byId);

  $viewTable.classList.add('hidden');
  $viewDetail.classList.remove('hidden');
  window.scrollTo(0, 0);
}
$backBtn.addEventListener('click', () => {
  $viewDetail.classList.add('hidden');
  $viewTable.classList.remove('hidden');
});

/* ============================================================
   TOOLTIP
   ============================================================ */
const $tip = document.getElementById('tip');
document.addEventListener('mousemove', ev => {
  const el = ev.target.closest('[data-tip]');
  if (!el) { $tip.classList.remove('vis'); return; }
  if ($tip.textContent !== el.dataset.tip) $tip.textContent = el.dataset.tip;
  $tip.classList.add('vis');
  const gap = 12;
  let left = ev.clientX + gap;
  let top  = ev.clientY - $tip.offsetHeight - gap;
  if (left + $tip.offsetWidth + 8 > window.innerWidth) left = ev.clientX - $tip.offsetWidth - gap;
  if (top < 8) top = ev.clientY + gap;
  $tip.style.left = left + 'px';
  $tip.style.top  = top  + 'px';
});

/* ============================================================
   CHARGES TABLE COLUMN SORT
   ============================================================ */
function sortChargesTable(th) {
  const table  = th.closest('table.charges');
  const tbody  = table.querySelector('tbody');
  const colIdx = th.cellIndex;
  const wasDir = th.dataset.sortDir || '';
  table.querySelectorAll('th.sortable').forEach(h => {
    h.dataset.sortDir = '';
    h.classList.remove('sort-asc', 'sort-desc');
    const ico = h.querySelector('.sort-ico');
    if (ico) ico.textContent = '⇅';
  });
  const dir = wasDir === 'asc' ? 'desc' : 'asc';
  th.dataset.sortDir = dir;
  th.classList.add(dir === 'asc' ? 'sort-asc' : 'sort-desc');
  const ico = th.querySelector('.sort-ico');
  if (ico) ico.textContent = dir === 'asc' ? '↑' : '↓';
  function cellVal(row) {
    const cell = row.cells[colIdx];
    if (!cell) return '';
    const raw = (cell.firstChild && cell.firstChild.nodeType === 3 ? cell.firstChild.textContent : cell.textContent).trim();
    if (raw === '—' || raw === '') return dir === 'asc' ? '￿' : '';
    // Date: dd.mm.yyyy
    const dm = raw.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
    if (dm) return new Date(+dm[3], +dm[2]-1, +dm[1]).getTime();
    // Currency amount: "9.500 kr" style
    const krM = raw.match(/^([\d.,]+)\s*kr$/);
    if (krM) { const n = parseFloat(krM[1].replace(/\./g,'').replace(',','.')); if (!isNaN(n)) return n; }
    // Pure integer (payer accounting no., invoice ID)
    if (/^\d+$/.test(raw)) return parseInt(raw, 10);
    // Everything else (unit names, payer names, products): natural string
    return raw;
  }
  function sortSection(rows) {
    return rows.sort((a, b) => {
      const va = cellVal(a), vb = cellVal(b);
      const mul = dir === 'asc' ? 1 : -1;
      if (typeof va === 'string' && typeof vb === 'string')
        return mul * va.localeCompare(vb, 'da', { numeric: true, sensitivity: 'base' });
      if (va < vb) return -mul;
      if (va > vb) return mul;
      return 0;
    });
  }
  const all=Array.from(tbody.querySelectorAll('tr'));
  const secHds=all.filter(r=>r.classList.contains('charges-section-hd'));
  const vacant=all.filter(r=>r.classList.contains('charges-vacant')&&!r.classList.contains('charges-section-hd'));
  const invoiced=all.filter(r=>!r.classList.contains('charges-vacant')&&!r.classList.contains('charges-section-hd'));
  tbody.innerHTML='';
  if(secHds[0]&&vacant.length)tbody.appendChild(secHds[0]);
  sortSection(vacant).forEach(r=>tbody.appendChild(r));
  if(secHds[1]&&invoiced.length)tbody.appendChild(secHds[1]);
  else if(secHds[0]&&!vacant.length)tbody.appendChild(secHds[0]);
  sortSection(invoiced).forEach(r=>tbody.appendChild(r));
}

/* ============================================================
   ATTRIBUTION → CHARGES TABLE FILTER
   ============================================================ */
let _chargesFilter = null;
function applyChargesFilter(filterKey, rowEl) {
  const attrCard    = rowEl.closest('.attr-card');
  const chargesCard = document.querySelector('#detail-charges-host .charges-card');
  if (attrCard) attrCard.querySelectorAll('.attr-driver').forEach(r => r.classList.remove('filter-active'));
  if (_chargesFilter === filterKey) {
    _chargesFilter = null;
    if (chargesCard) chargesCard.querySelectorAll('tbody tr').forEach(r => r.classList.remove('filter-hidden'));
    return;
  }
  _chargesFilter = filterKey;
  rowEl.classList.add('filter-active');
  if (chargesCard) {
    chargesCard.querySelectorAll('tbody tr').forEach(r => {
      if (r.classList.contains('charges-section-hd')) { r.classList.add('filter-hidden'); return; }
      const driver  = r.dataset.driver || 'unchanged';
      const matches = filterKey === 'missed' ? false : driver === filterKey;
      r.classList.toggle('filter-hidden', !matches);
    });
    if (filterKey === 'missed') {
      const alert = document.querySelector('#detail-alert-host .detail-alert');
      if (alert) alert.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }
}

/* ============================================================
   EXPORT MODAL & XLS GENERATION
   ============================================================ */
(function initExportModal() {
  const sel = document.getElementById('exp-entity');
  // "All entities" as first option
  const allOpt = document.createElement('option');
  allOpt.value = ''; allOpt.textContent = 'All entities';
  sel.appendChild(allOpt);
  ENTITIES.forEach(e => {
    const opt = document.createElement('option');
    opt.value = e.id; opt.textContent = e.name;
    sel.appendChild(opt);
  });
})();

document.getElementById('export-btn').addEventListener('click', openExportModal);

function openExportModal()  { document.getElementById('export-modal').classList.remove('hidden'); }
function closeExportModal() { document.getElementById('export-modal').classList.add('hidden'); }
document.getElementById('export-modal').addEventListener('click', function(e) {
  if (e.target === this) closeExportModal();
});

function expPeriodClick(btn) {
  btn.closest('.segmented').querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('exp-custom-range').classList.toggle('hidden', btn.dataset.months !== 'custom');
}

// Last N calendar months ending at the prototype's "today" (May 2026), 0-indexed
function exportMonths(n) {
  const now = new Date(2026, 4, 21);
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    out.push({ y: d.getFullYear(), m: d.getMonth() });
  }
  return out;
}

// Build month list from custom YYYY-MM inputs
function exportMonthsCustom() {
  const fromVal = document.getElementById('exp-from').value; // "YYYY-MM"
  const toVal   = document.getElementById('exp-to').value;
  if (!fromVal || !toVal) return exportMonths(3);
  const [fy, fm] = fromVal.split('-').map(Number);
  const [ty, tm] = toVal.split('-').map(Number);
  // Ensure from ≤ to
  const fromMs = new Date(fy, fm - 1, 1).getTime();
  const toMs   = new Date(ty, tm - 1, 1).getTime();
  if (fromMs > toMs) return [];
  const out = [];
  let y = fy, m = fm - 1; // 0-indexed
  while (true) {
    out.push({ y, m });
    if (y === ty && m === tm - 1) break;
    m++;
    if (m > 11) { m = 0; y++; }
    if (out.length > 60) break; // safety cap
  }
  return out;
}

function runExport() {
  if (typeof XLSX === 'undefined') {
    alert('SheetJS library not loaded — check your internet connection.');
    return;
  }
  const activeBtn      = document.querySelector('#exp-period button.active');
  const mths           = activeBtn.dataset.months === 'custom'
    ? exportMonthsCustom()
    : exportMonths(parseInt(activeBtn.dataset.months, 10));
  const includeVacant  = document.getElementById('exp-vacant').checked;
  const includeCharges = document.getElementById('exp-charges').checked;
  const entityVal      = document.getElementById('exp-entity').value;
  const entitiesToExport = entityVal === ''
    ? ENTITIES
    : [ENTITIES.find(e => e.id === entityVal)].filter(Boolean);

  const spinner = document.getElementById('exp-spinner');
  const label   = document.getElementById('exp-btn-label');
  spinner.classList.add('visible');
  label.textContent = 'Exporting…';

  // Discover full product set across all selected entities × months (shared)
  const prodSet = new Set();
  entitiesToExport.forEach(e => mths.forEach(({y, m}) => {
    const c = getCell(e, y, m);
    Object.keys(c.invoicedByProduct).forEach(p => prodSet.add(p));
    if (includeVacant) Object.keys(c.vacantByProduct).forEach(p => prodSet.add(p));
  }));
  const prods = Array.from(prodSet).sort();

  setTimeout(() => {
    try {
      entitiesToExport.forEach((entity, idx) => {
        setTimeout(() => {
          const wb = XLSX.utils.book_new();
          addRentRollSheet(wb, entity, mths, includeVacant, prods);
          if (includeCharges) addChargesSheets(wb, entity, mths);
          const safeName = entity.name.replace(/[^\w]/g, '-').replace(/-+/g, '-').toLowerCase();
          XLSX.writeFile(wb, `${safeName}.xlsx`);
        }, idx * 300);
      });
    } finally {
      spinner.classList.remove('visible');
      label.textContent = 'Export XLS';
      closeExportModal();
    }
  }, 50);
}

/* ---------- Rent Roll sheet (appends one sheet to wb) ---------- */
// Apply comma thousand-separator format to every numeric cell in a worksheet
function fmtWsNumbers(ws) {
  Object.keys(ws).forEach(ref => {
    if (ref[0] === '!') return;
    const cell = ws[ref];
    if (cell && cell.t === 'n') cell.z = '#,##0';
  });
}

function addRentRollSheet(wb, entity, mths, includeVacant, prods) {
  const cells = mths.map(({y, m}) => getCell(entity, y, m));
  const sum   = arr => arr.reduce((a, b) => a + b, 0);
  const periodLabel = mths.length === 1
    ? `${MONTHS_EN[mths[0].m]} ${mths[0].y}`
    : `${MONTHS_EN[mths[0].m]} ${mths[0].y} – ${MONTHS_EN[mths[mths.length-1].m]} ${mths[mths.length-1].y}`;

  const aoa = [];

  // Entity name
  aoa.push([entity.name]);
  aoa.push([]);

  // ── Totals section ──────────────────────────────────────────
  aoa.push([`Total (${mths.length} month${mths.length > 1 ? 's' : ''})`, periodLabel]);
  aoa.push(['Total',          sum(cells.map(c => c.total))]);
  aoa.push(['Total invoiced', sum(cells.map(c => c.invoiced))]);
  prods.forEach(p => aoa.push([`  ${p}`, sum(cells.map(c => c.invoicedByProduct[p] || 0))]));
  if (includeVacant) {
    aoa.push(['Total vacant', sum(cells.map(c => c.vacant))]);
    prods.forEach(p => aoa.push([`  ${p}`, sum(cells.map(c => c.vacantByProduct[p] || 0))]));
  }
  aoa.push([]);

  // ── Per-month breakdown ──────────────────────────────────────
  const periodHdr = ['', ...mths.map(({y, m}) => `${MONTHS_EN[m]} ${y}`)];
  aoa.push(periodHdr);
  aoa.push(['Total',          ...cells.map(c => c.total)]);
  aoa.push(['Total invoiced', ...cells.map(c => c.invoiced)]);
  prods.forEach(p => aoa.push([`  ${p}`, ...cells.map(c => c.invoicedByProduct[p] || 0)]));
  if (includeVacant) {
    aoa.push(['Total vacant', ...cells.map(c => c.vacant)]);
    prods.forEach(p => aoa.push([`  ${p}`, ...cells.map(c => c.vacantByProduct[p] || 0)]));
  }

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{wch: 30}, ...mths.map(() => ({wch: 16}))];
  fmtWsNumbers(ws);
  XLSX.utils.book_append_sheet(wb, ws, 'Rent Roll');
}

/* ---------- Charges sheets (one sheet per month, appended to wb) ---------- */
function addChargesSheets(wb, entity, mths) {
  mths.forEach(({y, m}) => {
    const c        = getCell(entity, y, m);
    const _pd      = new Date(y, m - 1, 1);
    const prevCell = getCell(entity, _pd.getFullYear(), _pd.getMonth());
    const delta    = Math.round(c.total - prevCell.total);
    const dates    = chargeDates(y, m);
    const issueStr  = fmtDate(dates.issue);
    const dueStr    = fmtDate(dates.due);
    const periodStr = `${fmtDate(dates.periodStart)}–${fmtDate(dates.periodEnd)}`;
    const sgn       = delta >= 0 ? '+' : '−';

    const aoa = [];
    aoa.push([`${entity.name} — ${MONTHS_EN[m]} ${y}`]);
    aoa.push([]);
    aoa.push(['Summary']);
    aoa.push(['Total invoiced', c.invoiced]);
    Object.entries(c.invoicedByProduct).forEach(([p, v]) => aoa.push([`  ${p}`, v]));
    aoa.push(['Vacant rent', c.vacant]);
    Object.entries(c.vacantByProduct).forEach(([p, v]) => aoa.push([`  ${p}`, v]));
    aoa.push(['Change vs previous month', `${sgn}${Math.abs(delta).toLocaleString('da-DK')} kr`]);
    aoa.push([]);
    aoa.push(['Issue date','Due date','Accounting period','Unit','Payer name',
              'Payer accounting no.','Invoicing product','Invoice ID','Amount']);
    c.bookings.filter(b => b.tenant === null).forEach(b => {
      aoa.push([issueStr, dueStr, periodStr, b.unit, '—', '—',
                b.product || '1001 - Monthly Rent', '—', b.monthly]);
    });
    const aptB = c.bookings.filter(b => b.tenant !== null && b.invoiced && !b.isParking);
    const pkB  = c.bookings.filter(b => b.tenant !== null && b.invoiced &&  b.isParking);
    aptB.forEach((b, i) => aoa.push([issueStr, dueStr, periodStr, b.unit, b.tenant,
      getPayerCode(b.parentId || b.id) || '—', b.product || '1001 - Monthly Rent',
      buildInvoiceId(y, m, i + 1), b.monthly]));
    pkB.forEach((b, i) => aoa.push([issueStr, dueStr, periodStr, b.unit, b.tenant,
      getPayerCode(b.parentId || b.id) || '—', b.product || '2001 - Parking',
      buildInvoiceId(y, m, 500 + i + 1), b.monthly]));

    const ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:12},{wch:12},{wch:26},{wch:30},{wch:24},{wch:22},{wch:26},{wch:12},{wch:12}];
    fmtWsNumbers(ws);
    XLSX.utils.book_append_sheet(wb, ws, `${MONTHS_EN[m].slice(0,3)} ${y}`);
  });
}

render();
